name: Release

# Push a tag `v<version>` (e.g. v2027.0.0-alpha.3) whose version equals
# `platform.version` in platform/strata-2027.toml and the facade's
# Cargo.toml. The release runs all of CI, publishes strata-platform to
# crates.io and creates the GitHub release with the conformance table.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag matches the spec
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # The spec and the facade agree (`cargo xtask check`); the tag must
      # agree with both.
      - run: cargo xtask check
      - id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "strata-platform") | .version')
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match strata-platform $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo publish -p strata-platform --dry-run --locked

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: [verify, ci]
    runs-on: ubuntu-latest
    # Trusted publishing: crates.io must list this repository, the workflow
    # `release.yml` and the environment `crates-io` for strata-platform.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p strata-platform --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Written by the `status` job of the CI run above.
      - uses: actions/download-artifact@v4
        with:
          name: strata-status
          path: status
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          {
            echo "\`strata-platform = \"$VERSION\"\` on [crates.io](https://crates.io/crates/strata-platform/$VERSION)."
            echo "The spec is [platform/STRATA-2027.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/platform/STRATA-2027.md)."
            echo
            cat status/STATUS.md
          } > notes.md
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Strata $VERSION" --notes-file notes.md "${flags[@]}" \
            status/STATUS.md status/status.json \
            platform/strata-2027.toml platform/STRATA-2027.md
