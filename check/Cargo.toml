[package]
name = "strata-check"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Builds every Strata 2027 mineral and Crust in one graph and checks they interoperate"

[dependencies]
strata = { package = "strata-platform", path = "../crates/strata", features = ["full", "serde"] }
# The downstream consumer. Pinned to the commit audited in platform/AUDIT.md.
crust-core = { git = "https://github.com/doubleailes/crust-render", rev = "5e5721e115848ab4a7c6a9472f17adf7ad90f8db" }
crust-assets = { git = "https://github.com/doubleailes/crust-render", rev = "5e5721e115848ab4a7c6a9472f17adf7ad90f8db" }

[lints]
workspace = true
